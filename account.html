<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Retrieval - BIG A$$ET INC.</title>
    <link rel="stylesheet" href="../styles/support-style.css">
    <link rel="stylesheet" href="../styles/form-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Add storage.js to access user data -->
    <script src="../scripts/storage.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>BIG A$$ET INC.</h1>
        </div>
        <nav>
            <ul>
                <li><a href="accounting.html">Accounting</a></li>
                <li><a href="stocks.html">Stocks</a></li>
                <li><a href="../index2.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <main>
            <div class="form-title-container">
                <h2 class="form-title">Account Retrieval</h2>
            </div>
            
            <div class="form-container">
                <a href="support.html" class="back-arrow">
                    <i class="fas fa-chevron-left"></i>
                </a>
                
                <div class="email-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                
                <p class="form-message">
                    Our team will attempt to retrieve<br>
                    your account, Please wait for an Email!
                    <br><span class="team-signature">-Big A$$ET Team.</span>
                </p>
                
                <form id="account-form">
                    <div class="form-group">
                        <label for="user">User:</label>
                        <input type="text" id="user" name="user" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="number">Number:</label>
                        <input type="text" id="number" name="number" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    
                    <button type="submit" class="form-submit">Submit</button>
                </form>
            </div>
        </main>
    </div>
    
    <script>
        // Pre-populate form fields with logged-in user data
        document.addEventListener('DOMContentLoaded', function() {
            // Get user data from storage
            const userData = getUserData();
            
            // If user is logged in, populate form fields
            if (userData) {
                const userField = document.getElementById('user');
                const emailField = document.getElementById('email');
                
                if (userField && userData.username) {
                    userField.value = userData.username;
                }
                
                if (emailField && userData.email) {
                    emailField.value = userData.email;
                }
            }
        });

        document.getElementById('account-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formMessage = document.querySelector('.form-message');
            const form = document.getElementById('account-form');
            
            // Display success message
            formMessage.style.display = 'block';
            form.style.display = 'none';
        });
    </script>
    <script src="../scripts/translation.js" defer></script>
</body>
</html>
